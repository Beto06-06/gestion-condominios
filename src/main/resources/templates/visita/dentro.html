<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head('visita.dentroTitulo')}"></head>
    <body>
        <a class="visually-hidden-focusable skip" href="#contenido" th:text="#{nav.saltar}"></a>
        <aside th:replace="~{general/fragmentos :: menu('dentro')}"></aside>
        <section th:replace="~{general/fragmentos :: confirmarEliminar(@{/visita/salida}, 'idVisita', 'confirmacion.visitaSalida')}"></section>
        <main class="main">
            <header th:replace="~{general/fragmentos :: barra('visita.dentroTitulo')}"></header>
            <div class="contenido" id="contenido">
                <section th:replace="~{general/fragmentos :: mensajes}"></section>
                <div class="encabezado">
                    <p th:text="#{visita.dentroDescripcion}"></p>
                    <a class="btn btn-primary" th:href="@{/visita/registro}" th:text="#{visita.registrar}"></a>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <section class="panel h-100">
                            <h2 th:text="#{visita.dentroAhora}"></h2>
                            <strong class="fs-3" th:text="${totalDentro}"></strong>
                        </section>
                    </div>
                    <div class="col-md-4">
                        <section class="panel h-100">
                            <h2 th:text="#{visita.parqueosLibres}"></h2>
                            <strong class="fs-3" th:text="${parqueosLibres}"></strong>
                        </section>
                    </div>
                    <div class="col-md-4">
                        <section class="panel h-100">
                            <h2 th:text="#{visita.ingresosHoy}"></h2>
                            <strong class="fs-3" th:text="${ingresosHoy}"></strong>
                        </section>
                    </div>
                </div>
                <div class="tabla">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th th:text="#{visita.visitante}"></th>
                                <th th:text="#{filial.unidad}"></th>
                                <th th:text="#{visita.fechaIngreso}"></th>
                                <th th:text="#{visita.vehiculoParqueo}"></th>
                                <th th:text="#{visita.guarda}"></th>
                                <th th:text="#{accion.acciones}"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="visita:${visitas}">
                                <td>
                                    <strong class="d-block" th:text="${visita.visitante.persona.nombreCompleto}"></strong>
                                    <small th:text="${visita.visitante.persona.cedula}"></small>
                                </td>
                                <td th:text="${visita.filial.numero}"></td>
                                <td th:text="${#temporals.format(visita.fechaIngreso, 'dd/MM/yyyy HH:mm:ss')}"></td>
                                <td>
                                    <span th:if="${visita.vehiculo != null}" th:text="${visita.vehiculo.placa}"></span>
                                    <span th:if="${visita.parqueoAsignado != null}"
                                          th:text="' - '+${visita.parqueoAsignado.codigo}"></span>
                                    <span th:if="${visita.vehiculo == null}" th:text="#{visita.aPie}"></span>
                                </td>
                                <td th:text="${visita.empleadoPuesto.empleado.persona.nombreCompleto}"></td>
                                <td>
                                    <button type="button"
                                            class="btn btn-sm btn-success"
                                            data-bs-toggle="modal"
                                            data-bs-target="#confirmModal"
                                            th:data-bs-id="${visita.idVisita}"
                                            th:data-bs-descripcion="${visita.visitante.persona.nombreCompleto+' - '+visita.filial.numero}"
                                            th:text="#{visita.registrarSalida}"></button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(visitas)}">
                                <td colspan="6" class="ayuda" th:text="#{visita.sinDentro}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <p class="alert alert-info mt-4" th:text="#{visita.salidaAyuda}"></p>
            </div>
        </main>
    </body>
</html>
