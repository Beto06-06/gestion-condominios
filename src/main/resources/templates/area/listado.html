<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head('area.titulo')}"></head>
    <body>
        <a class="visually-hidden-focusable skip" href="#contenido" th:text="#{nav.saltar}"></a>
        <aside th:replace="~{general/fragmentos :: menu('areas')}"></aside>
        <section th:replace="~{general/fragmentos :: confirmarEliminar(@{/area/eliminar}, 'idAreaComun', 'confirmacion.areaEliminar')}"></section>
        <main class="main">
            <header th:replace="~{general/fragmentos :: barra('area.titulo')}"></header>
            <div class="contenido" id="contenido">
                <section th:replace="~{general/fragmentos :: mensajes}"></section>
                <div class="encabezado">
                    <p th:text="#{area.descripcion}"></p>
                </div>
                <form class="mb-4 d-flex align-items-center gap-3" method="get" th:action="@{/area/listado}">
                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               id="soloActivas"
                               name="soloActivas"
                               value="true"
                               th:checked="${soloActivas}">
                        <label class="form-check-label" for="soloActivas" th:text="#{area.soloActivas}"></label>
                    </div>
                    <button class="btn btn-outline-primary" th:text="#{filtro.filtrar}"></button>
                </form>
                <div class="row g-4">
                    <div class="col-xl-8">
                        <div class="row g-3">
                            <article class="col-md-6" th:each="area:${areas}">
                                <div class="panel h-100">
                                    <div class="d-flex align-items-start justify-content-between gap-2">
                                        <h2 class="text-break" th:text="${area.nombre}"></h2>
                                        <span class="badge"
                                              th:classappend="${area.activo}?'text-bg-success':'text-bg-secondary'"
                                              th:text="${area.activo}?#{area.activa}:#{area.inactiva}"></span>
                                    </div>
                                    <p class="ayuda text-break" th:text="${area.descripcion}"></p>
                                    <p>
                                        <i class="fa-solid fa-users" aria-hidden="true"></i>
                                        <span th:text="${area.capacidad}+' '+#{area.personas}"></span>
                                    </p>
                                    <p>
                                        <i class="fa-regular fa-clock" aria-hidden="true"></i>
                                        <span th:text="${#temporals.format(area.horaApertura, 'HH:mm:ss')}+' - '+${#temporals.format(area.horaCierre, 'HH:mm:ss')}"></span>
                                    </p>
                                    <p class="ayuda" th:unless="${area.activo}" th:text="#{area.inactivaAyuda}"></p>
                                    <div class="acciones">
                                        <a class="btn btn-sm btn-outline-primary"
                                           th:href="@{/area/listado(editar=${area.idAreaComun},soloActivas=${soloActivas})}"
                                           th:text="#{accion.editar}"></a>
                                        <form method="post" th:action="@{/area/estado}">
                                            <input type="hidden" name="idAreaComun" th:value="${area.idAreaComun}">
                                            <input type="hidden" name="soloActivas" th:value="${soloActivas}">
                                            <button class="btn btn-sm btn-outline-primary"
                                                    th:text="${area.activo}?#{accion.desactivar}:#{accion.activar}"></button>
                                        </form>
                                        <button type="button"
                                                class="btn btn-sm btn-outline-danger"
                                                data-bs-toggle="modal"
                                                data-bs-target="#confirmModal"
                                                th:data-bs-id="${area.idAreaComun}"
                                                th:data-bs-descripcion="${area.nombre}"
                                                th:text="#{accion.eliminar}"></button>
                                    </div>
                                </div>
                            </article>
                            <p class="ayuda" th:if="${#lists.isEmpty(areas)}" th:text="#{area.sinRegistros}"></p>
                        </div>
                    </div>
                    <aside class="col-xl-4">
                        <section class="panel">
                            <h2 th:text="${areaComun.idAreaComun == null}?#{area.nueva}:#{area.editar}"></h2>
                            <p class="ayuda" th:text="#{form.obligatorios}"></p>
                            <form method="post" th:action="@{/area/guardar}" th:object="${areaComun}">
                                <input type="hidden" th:field="*{idAreaComun}">
                                <input type="hidden" name="soloActivas" th:value="${soloActivas}">
                                <div class="mb-3">
                                    <label class="form-label" for="nombre" th:text="#{area.nombre}+' *'"></label>
                                    <input class="form-control"
                                           th:field="*{nombre}"
                                           th:errorclass="is-invalid"
                                           maxlength="100"
                                           required>
                                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="descripcion" th:text="#{area.detalle}+' *'"></label>
                                    <textarea class="form-control"
                                              rows="4"
                                              th:field="*{descripcion}"
                                              th:errorclass="is-invalid"
                                              required></textarea>
                                    <div class="invalid-feedback" th:errors="*{descripcion}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="capacidad" th:text="#{area.capacidad}+' *'"></label>
                                    <input class="form-control"
                                           type="number"
                                           th:field="*{capacidad}"
                                           th:errorclass="is-invalid"
                                           min="1"
                                           max="2147483647"
                                           step="1"
                                           required>
                                    <div class="invalid-feedback" th:errors="*{capacidad}"></div>
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-sm-6 col-xl-12 col-xxl-6">
                                        <label class="form-label" for="horaApertura" th:text="#{area.apertura}+' *'"></label>
                                        <input class="form-control"
                                               type="time"
                                               id="horaApertura"
                                               name="horaApertura"
                                               step="1"
                                               th:value="${areaComun.horaApertura}"
                                               th:classappend="${#fields.hasErrors('horaApertura')}?'is-invalid'"
                                               required>
                                        <div class="invalid-feedback" th:errors="*{horaApertura}"></div>
                                    </div>
                                    <div class="col-sm-6 col-xl-12 col-xxl-6">
                                        <label class="form-label" for="horaCierre" th:text="#{area.cierre}+' *'"></label>
                                        <input class="form-control"
                                               type="time"
                                               id="horaCierre"
                                               name="horaCierre"
                                               step="1"
                                               th:value="${areaComun.horaCierre}"
                                               th:classappend="${#fields.hasErrors('horaCierre')}?'is-invalid'"
                                               required>
                                        <div class="invalid-feedback" th:errors="*{horaCierre}"></div>
                                    </div>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}">
                                    <label class="form-check-label" for="activo" th:text="#{area.activa}"></label>
                                </div>
                                <div class="acciones">
                                    <button class="btn btn-primary" th:text="#{accion.guardar}"></button>
                                    <a class="btn btn-outline-primary"
                                       th:href="@{/area/listado(soloActivas=${soloActivas})}"
                                       th:text="#{accion.cancelar}"></a>
                                </div>
                            </form>
                        </section>
                    </aside>
                </div>
            </div>
        </main>
    </body>
</html>
